name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned rather than ubuntu-latest. setup-python publishes no
        # 3.9 build for Ubuntu 26.04, which ubuntu-latest now resolves
        # to, so that job failed in 7s before installing anything.
        # 3.9 is the only series affected; 3.10+ all ship 26.04 builds.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
        exclude:
          # Keep the matrix small: one non-Linux job per supported edge.
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  # Newest Ubuntu, on the versions it actually ships, so the matrix above
  # staying pinned does not mean the project goes untested on current
  # distributions.
  test-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

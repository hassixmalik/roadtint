[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadtint"
version = "0.1.0"
description = "Quantify road congestion from traffic-layer map imagery."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Muhammad Hassan Raza" }]
keywords = ["traffic", "congestion", "gis", "image-analysis", "maps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.21",
    "pillow>=9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.6"]
plot  = ["matplotlib>=3.5"]
dev   = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
roadtint = "roadtint.cli:main"

[project.urls]
Homepage = "https://github.com/hassixmalik/Trafic-Prediction-System"
Issues = "https://github.com/hassixmalik/Trafic-Prediction-System/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roadtint = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The package supports 3.9, so typing.List/Dict in annotations are not
# upgradable to builtin generics everywhere ruff would like.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "UP006",  # non-pep585-annotation: needs >=3.9 runtime subscripting
    "UP035",  # deprecated-import: typing.List etc still required on 3.9
    "E501",   # line length is handled by the formatter
    "RUF046", # explicit int(round(...)) documents the intended return type
]

[tool.ruff.lint.per-file-ignores]
# __all__ is grouped by topic with comments, which reads better than
# alphabetical for a surface this size.
"src/roadtint/__init__.py" = ["RUF022"]
